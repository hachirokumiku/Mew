name: Build WobbleKit APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, copilot/build-apk]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test zone and sensor math
        run: |
          mkdir -p /tmp/wobble-tests
          javac -d /tmp/wobble-tests app/src/main/java/com/sharkie/wobblekit/WobbleMath.java app/src/main/java/com/sharkie/wobblekit/MotionFilter.java app/src/main/java/com/sharkie/wobblekit/JellyZone.java app/src/test/java/com/sharkie/wobblekit/WobbleMathTest.java
          java -cp /tmp/wobble-tests com.sharkie.wobblekit.WobbleMathTest
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WobbleKit-S26-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
